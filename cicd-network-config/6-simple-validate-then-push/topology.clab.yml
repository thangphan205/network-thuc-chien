---
name: cicd_simple_validate_push_lab

mgmt:

  network: cicd_simple_validate_push_mgmt
  ipv4-subnet: 192.168.26.0/24

topology:
  nodes:
    cisco1:
      kind: cisco_iol
      image: vrnetlab/cisco_iol:17.12.01
      type: l2
      mgmt-ipv4: 192.168.26.11
      startup-config: ./config/cisco.config.partial
    juniper1:
      kind: juniper_crpd
      image: crpd:26.2R1.7
      mgmt-ipv4: 192.168.26.12
      startup-config: ./config/juniper.conf
  links:
    - endpoints: ["cisco1:eth1", "juniper1:eth1"]

!
hostname fw-edge
!
interface Ethernet0/0
 description WAN-to-Internet
 ip address 203.0.113.2 255.255.255.252
!
interface Ethernet0/1
 description LAN-to-r1-core
 ip address 10.0.0.1 255.255.255.252
 ip access-group SEC-ACL-IN in
!
router ospf 1
 router-id 1.1.1.1
 network 10.0.0.0 0.0.0.3 area 0
 default-information originate
!
ip access-list extended SEC-ACL-IN
 remark CR-2026: Block all traffic to DB Subnet except App Server (MISTAKE: Placed broad deny first)
 deny ip any 10.20.20.0 0.0.0.255
 remark Allow App Server to Database Server (UNREACHABLE / SHADOWED LINE!)
 permit tcp 10.10.10.0 0.0.0.255 10.20.20.0 0.0.0.255 eq 5432
 remark Allow Management SSH access
 permit tcp 10.99.0.0 0.0.0.255 any eq 22
 remark Allow Web HTTPS access
 permit tcp any 192.168.1.0 0.0.0.255 eq 443
 remark Deny all other IP traffic
 deny ip any any
!
end

all:
  hosts:
    # Container ten "cisco1" trong topology.clab.yml (lab rut gon con 1 node
    # de demo). config_name tro toi file cau hinh no dong vai - fw-edge la
    # thiet bi co san bug ACL shadow trong configs/proposed/, phu hop nhat
    # de demo push mot dong bo voi Batfish gate.
    cisco1:
      ansible_host: 192.168.26.11
      config_name: fw-edge
  vars:
    ansible_network_os: ios

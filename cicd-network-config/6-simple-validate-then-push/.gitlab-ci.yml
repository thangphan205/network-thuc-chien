---
# GitLab CI/CD pipeline definition for Lab 6 - Simple Validate-then-Push
# Run lint -> Batfish gate -> push config to devices & optional GitLab repo sync

stages:
  - lint
  - batfish-gate
  - push

variables:
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""

default:
  image: python:3.12-slim

lint-job:
  stage: lint
  script:
    - apt-get update && apt-get install -y git
    - pip install yamllint ansible-lint ansible
    - yamllint ansible/ topology.clab.yml docker-compose.yml
    - ansible-lint ansible/push_config.yml

batfish-gate-job:
  stage: batfish-gate
  image: docker:24.0.5-cli
  services:
    - name: docker:24.0.5-dind
      alias: docker
  script:
    - apk add --no-cache python3 py3-pip netcat-openbsd bash
    - pip install -r requirements.txt --break-system-packages
    - docker compose up -d
    - |
      for i in $(seq 1 30); do
        nc -z localhost 9996 && break
        sleep 2
      done
    - python3 batfish_gate.py

push-to-devices-job:
  stage: push
  tags:
    - self-hosted
    - server-lab
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - ansible-galaxy collection install -r ansible/requirements.yml
    - ansible-playbook -i ansible/inventory.yml ansible/push_config.yml

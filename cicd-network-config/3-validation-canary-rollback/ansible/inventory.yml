all:
  children:
    canary:
      hosts:
        canary1:
          ansible_host: 192.168.23.11
    rest:
      hosts:
        node2:
          ansible_host: 192.168.23.12
        node3:
          ansible_host: 192.168.23.13
  vars:
    ansible_network_os: ios
    ansible_connection: network_cli
    ansible_user: backup_user
    ansible_password: "{{ lookup('env', 'LAB_DEVICE_PASSWORD') }}"
    ansible_become: yes
    ansible_become_method: enable
    ansible_become_password: "{{ lookup('env', 'LAB_ENABLE_PASSWORD') }}"

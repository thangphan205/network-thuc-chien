services:
  server:
    build: ./server
    container_name: lab09-server
    # privileged: can thiet de ghi sysctl net.netfilter.* trong netns cua container
    # (Docker Desktop mount /proc/sys read-only voi container thuong)
    privileged: true
    networks:
      lab-net:
        ipv4_address: 172.28.9.10

  client:
    image: alpine:latest
    container_name: lab09-client
    command: sleep infinity
    init: true
    networks:
      lab-net:
        ipv4_address: 172.28.9.20
    depends_on:
      - server

networks:
  lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.9.0/24

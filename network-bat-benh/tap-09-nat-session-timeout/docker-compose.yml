services:
  server:
    image: nginx:alpine
    container_name: lab09-server
    cap_add:
      - NET_ADMIN
    networks:
      lab-net:
        ipv4_address: 172.28.9.10

  client:
    image: alpine:latest
    container_name: lab09-client
    cap_add:
      - NET_ADMIN
    command: sleep infinity
    init: true
    networks:
      lab-net:
        ipv4_address: 172.28.9.20
    depends_on:
      - server

networks:
  lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.9.0/24

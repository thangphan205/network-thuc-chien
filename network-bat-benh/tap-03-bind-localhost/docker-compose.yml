services:
  # Seed file cấu hình đang chạy (nginx/nginx.conf) = trạng thái ĐÃ CHỮA lúc `up`.
  # nginx.conf được gitignore nên chạy fault/fix không làm bẩn cây git.
  config-init:
    image: alpine:latest
    container_name: lab03-config-init
    network_mode: none
    volumes:
      - ./nginx:/nginx
    command: sh -c "cp /nginx/conf/good.conf /nginx/nginx.conf"

  web-server:
    build: .
    container_name: lab03-web-server
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "8083:80"
    depends_on:
      config-init:
        condition: service_completed_successfully
    networks:
      lab-net:
        ipv4_address: 172.28.3.10

  client:
    build: ./client
    container_name: lab03-client
    command: sleep infinity
    init: true
    networks:
      lab-net:
        ipv4_address: 172.28.3.20
    depends_on:
      - web-server

networks:
  lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.3.0/24

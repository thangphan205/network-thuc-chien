services:
  web-server:
    image: nginx:alpine
    container_name: lab03-web-server
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "8083:80"
    networks:
      lab-net:
        ipv4_address: 172.28.3.10

  client:
    image: alpine:latest
    container_name: lab03-client
    command: sleep infinity
    init: true
    networks:
      lab-net:
        ipv4_address: 172.28.3.20
    depends_on:
      - web-server

networks:
  lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.3.0/24

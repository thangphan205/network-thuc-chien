# ==============================================================================
# HAPROXY - Load balancer L7 đứng sau VIP của Keepalived
# ==============================================================================
global
    log stdout format raw local0 info
    maxconn 2048

defaults
    mode    http
    log     global
    option  httplog
    timeout connect 2s
    timeout client  10s
    timeout server  10s
    retries 2

# ------------------------------------------------------------------------------
# Frontend: nhận request từ client qua VIP 172.28.52.100
# bind *:80 để nghe trên CẢ IP thật lẫn VIP (VIP có thể xuất hiện/biến mất bất kỳ
# lúc nào khi Keepalived chuyển đổi -> không được bind cứng vào 1 địa chỉ).
# ------------------------------------------------------------------------------
frontend fe_web
    bind *:80
    default_backend be_web

# ------------------------------------------------------------------------------
# Backend: cân bằng tải round-robin xuống 2 nginx, có health check chủ động.
#
# Backend nằm ở TẦNG APP RIÊNG (172.28.53.0/24) nên mọi health check đều phải
# ĐI QUA ROUTER. Đó là chủ ý: kịch bản 11 chặn .52 -> .53 trên router, HAProxy
# mất cả 2 backend và trả HTTP 503 — cùng lời than "failover xong dịch vụ vẫn
# chết" nhưng ổ bệnh ở Tầng 3, không phải bảng ARP.
# ------------------------------------------------------------------------------
backend be_web
    balance roundrobin
    option httpchk GET /
    http-response set-header X-LB-Node "${LB_NAME}"
    server web-1 172.28.53.31:80 check inter 2s fall 2 rise 1
    server web-2 172.28.53.32:80 check inter 2s fall 2 rise 1

# ------------------------------------------------------------------------------
# Trang thống kê: http://<node>:8404/  — xem backend nào up/down theo thời gian thực
# ------------------------------------------------------------------------------
frontend fe_stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 2s

# ==============================================================================
# KEEPALIVED CONFIG - NODE-B (BACKUP)
# Interface: eth1 (Data network 172.28.52.0/24)
# Node BACKUP: priority 100 < 110 của node-a
# ==============================================================================

global_defs {
    router_id NODE_B
    enable_script_security
    script_user root
}

vrrp_script chk_nginx {
    script "/etc/keepalived/check_nginx.sh"
    interval 2
    timeout 2
    weight -20
    fall 2
    rise 2
}

vrrp_instance VI_SERVER {
    state BACKUP
    interface eth1
    virtual_router_id 51
    priority 100
    advert_int 1

    # Tùy chọn Virtual MAC theo chuẩn RFC 5798 (khi bật thì VIP đi kèm MAC ảo
    # 00:00:5e:00:01:34 nên router không cần học lại MAC -> hết bệnh blackhole):
    # use_vmac

    # ------------------------------------------------------------------
    # GARP TUNING - CÁC KEYWORD NÀY THUỘC vrrp_instance, KHÔNG PHẢI
    # global_defs. Đặt nhầm vào global_defs thì keepalived 2.x báo
    # "Unknown keyword 'garp_master_delay'" và bỏ qua toàn bộ tinh chỉnh.
    # (Bản global_defs tương ứng có tiền tố vrrp_: vrrp_garp_master_delay...)
    # ------------------------------------------------------------------
    garp_master_delay 1
    garp_master_repeat 3
    garp_master_refresh 60
    garp_master_refresh_repeat 2

    authentication {
        # VRRPv2 simple auth: TỐI ĐA 8 KÝ TỰ. Dài hơn sẽ bị keepalived
        # cắt cụt kèm cảnh báo "Truncating auth_pass to 8 characters".
        auth_type PASS
        auth_pass 9pingHA1
    }

    virtual_ipaddress {
        172.28.52.100/24 dev eth1 label eth1:vip
    }

    track_script {
        chk_nginx
    }

    notify_master "/usr/sbin/arping -U -c 5 -I eth1 172.28.52.100"
}

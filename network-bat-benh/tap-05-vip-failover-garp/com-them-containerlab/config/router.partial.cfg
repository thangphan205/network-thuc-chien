! ==============================================================================
! CISCO IOL ROUTER - PARTIAL CONFIG
! LAB: CONTAINERLAB TAP 05 - VIP FAILOVER GARP
!
! LƯU Ý QUAN TRỌNG:
! Đây là PARTIAL config (đuôi .partial.cfg). Containerlab sẽ NỐI THÊM đoạn này
! vào sau config bootstrap mặc định của kind cisco_iol.
! Nếu dùng full startup-config, config bootstrap sẽ bị GHI ĐÈ -> Ethernet0/0
! (cổng management, map sang eth0 của container) mất IP và bị shutdown
! -> mất luôn SSH/quản trị vào router.
!
! Sơ đồ cổng của kind cisco_iol trong Containerlab:
!   Ethernet0/0 -> eth0 (MANAGEMENT, containerlab tự cấu hình - ĐỪNG ĐỘNG VÀO)
!   Ethernet0/1 -> eth1 (data link đầu tiên khai báo trong topology)
!   Ethernet0/2 -> eth2 (data link thứ hai)
! ==============================================================================
!
ip routing
ip cef
!
! ------------------------------------------------------------------------------
! Ethernet0/1: KẾT NỐI SANG CLIENT LAN (172.28.51.0/24)
! ------------------------------------------------------------------------------
interface Ethernet0/1
 description [DATA] Connected to Client (eth1)
 ip address 172.28.51.254 255.255.255.0
 no ip redirects
 no ip proxy-arp
 no shutdown
!
! ------------------------------------------------------------------------------
! Ethernet0/2: KẾT NỐI SANG SERVER LAN (172.28.52.0/24 QUA BRIDGE br-server)
! ------------------------------------------------------------------------------
interface Ethernet0/2
 description [DATA] Connected to Server LAN (br-server)
 ip address 172.28.52.254 255.255.255.0
 no ip redirects
 no ip proxy-arp
 ! Mặc định Cisco ARP timeout là 14400 giây (4 tiếng) - chính là gốc của ca bệnh
 no shutdown
!
line con 0
 exec-timeout 0 0
 logging synchronous
!
end

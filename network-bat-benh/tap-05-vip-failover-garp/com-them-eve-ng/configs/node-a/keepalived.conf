! ==============================================================================
! KEEPALIVED PRODUCTION CONFIGURATION - NODE-A (MASTER)
! Path: /etc/keepalived/keepalived.conf
! ==============================================================================

global_defs {
    router_id NODE_A
    enable_script_security
    script_user root

    # PRODUCTION TUNING CHO GRATUITOUS ARP (GARP):
    # Thời gian chờ trước khi bắn đợt GARP đầu tiên sau khi lên MASTER (giây)
    garp_master_delay 1
    # Số lượng gói GARP gửi liên tiếp khi lên MASTER (chống rớt gói trên L2/Switch)
    garp_master_repeat 3
    # Chu kỳ định kỳ bắn lại GARP làm mới bảng ARP của Router/Switch (giây)
    garp_master_refresh 60
    # Số gói bắn ở mỗi chu kỳ refresh
    garp_master_refresh_repeat 2
}

# Kịch bản kiểm tra sức khỏe của Web Service Nginx
vrrp_script chk_nginx {
    script "/etc/keepalived/check_nginx.sh"
    interval 2     # Kiểm tra mỗi 2 giây
    timeout 2
    weight -20     # Nếu Nginx chết, giảm priority đi 20 (110 -> 90 < 100 của BACKUP)
    fall 2         # Chết 2 lần liên tiếp mới tính là FAIL
    rise 2         # Sống 2 lần liên tiếp mới tính là OK
}

vrrp_instance VI_SERVER {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 110
    advert_int 1

    # Tùy chọn RFC 5798 Virtual MAC (nếu bật, sẽ dùng MAC 00:00:5e:00:01:33 nhảy theo IP):
    # use_vmac

    authentication {
        auth_type PASS
        auth_pass 9pingHA1
    }

    virtual_ipaddress {
        172.28.52.100/24 dev eth0 label eth0:vip
    }

    track_script {
        chk_nginx
    }

    # Bắn GARP ngay khi nhận VIP
    notify_master "/usr/sbin/arping -U -c 5 -I eth0 172.28.52.100"
}

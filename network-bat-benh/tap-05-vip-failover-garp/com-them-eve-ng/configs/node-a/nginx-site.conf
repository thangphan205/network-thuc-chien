# NGINX PRODUCTION VIRTUAL HOST CONFIGURATION
# Path: /etc/nginx/conf.d/vip-service.conf (hoặc /etc/nginx/sites-available/default)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    location / {
        add_header X-Backend-Server "node-a-MASTER" always;
        add_header X-Server-IP "172.28.52.11" always;
        try_files $uri $uri/ =404;
    }

    # Endpoint phục vụ health check nhanh
    location = /healthz {
        access_log off;
        return 200 "OK\n";
    }
}

! ==============================================================================
! CISCO vIOS-L2 SWITCH CONFIGURATION - PRODUCTION BASELINE
! LAB: TAP 05 - VIP FAILOVER GARP & CISCO ARP TIMEOUT
! ==============================================================================
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Switch
!
! Quản trị bảo mật cơ bản
enable secret 9ping@Admin123
username admin privilege 15 secret 9ping@Admin123
ip domain-name lab.9ping.vn
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
ip ssh version 2
!
! Chế độ Spanning Tree chuẩn Enterprise
spanning-tree mode rapid-pvst
spanning-tree extend system-id
!
! ------------------------------------------------------------------------------
! CỔNG GIGABIT 0/0: UPLINK NỐI LÊN ROUTER vIOS (Gi0/1)
! ------------------------------------------------------------------------------
interface GigabitEthernet0/0
 description [UPLINK] Connect to vIOS Router (Gi0/1)
 switchport mode access
 switchport access vlan 1
 switchport nonegotiate
 duplex auto
 speed auto
 no shutdown
!
! ------------------------------------------------------------------------------
! CỔNG GIGABIT 0/1: NỐI XUỐNG NODE-A (MASTER)
! ------------------------------------------------------------------------------
interface GigabitEthernet0/1
 description [ACCESS] Connect to node-a (e0)
 switchport mode access
 switchport access vlan 1
 switchport nonegotiate
 ! BẮT BUỘC TRONG PRODUCTION: Bật PortFast để bỏ qua 30s Listening/Learning của STP!
 ! Nếu thiếu PortFast, GARP phát ra lúc link-up sẽ bị switch drop vào hư vô!
 spanning-tree portfast edge
 spanning-tree bpduguard enable
 duplex auto
 speed auto
 no shutdown
!
! ------------------------------------------------------------------------------
! CỔNG GIGABIT 0/2: NỐI XUỐNG NODE-B (BACKUP)
! ------------------------------------------------------------------------------
interface GigabitEthernet0/2
 description [ACCESS] Connect to node-b (e0)
 switchport mode access
 switchport access vlan 1
 switchport nonegotiate
 spanning-tree portfast edge
 spanning-tree bpduguard enable
 duplex auto
 speed auto
 no shutdown
!
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 transport input ssh
 exec-timeout 30 0
 logging synchronous
!
end

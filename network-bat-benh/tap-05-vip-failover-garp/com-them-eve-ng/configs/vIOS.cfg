! ==============================================================================
! CISCO vIOS ROUTER CONFIGURATION - PRODUCTION BASELINE
! LAB: TAP 05 - VIP FAILOVER GARP & CISCO ARP TIMEOUT
! ==============================================================================
!
version 15.9
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname vIOS
!
boot-start-marker
boot-end-marker
!
! Quản trị bảo mật cơ bản
enable secret 9ping@Admin123
username admin privilege 15 secret 9ping@Admin123
ip domain-name lab.9ping.vn
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
! Kích hoạt SSHv2
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
! Định tuyến L3
ip routing
ip cef
!
! ------------------------------------------------------------------------------
! CỔNG GIGABIT 0/0: KẾT NỐI SANG MẠNG CLIENT LAN
! ------------------------------------------------------------------------------
interface GigabitEthernet0/0
 description [DATA] Uplink to Client (e0)
 ip address 172.28.51.254 255.255.255.0
 no ip redirects
 no ip proxy-arp
 duplex auto
 speed auto
 media-type rj45
 no shutdown
!
! ------------------------------------------------------------------------------
! CỔNG GIGABIT 0/1: KẾT NỐI SANG MẠNG SERVER LAN (QUA SWITCH L2)
! ------------------------------------------------------------------------------
interface GigabitEthernet0/1
 description [DATA] Uplink to Server Switch (Gi0/0)
 ip address 172.28.52.254 255.255.255.0
 no ip redirects
 no ip proxy-arp
 ! ARP TIMEOUT MẶC ĐỊNH CỦA CISCO LÀ 14400s (4 TIẾNG)
 ! arp timeout 14400
 duplex auto
 speed auto
 media-type rj45
 no shutdown
!
! ------------------------------------------------------------------------------
! CỔNG GIGABIT 0/3: OUT-OF-BAND (OOB) MANAGEMENT
! ------------------------------------------------------------------------------
interface GigabitEthernet0/3
 description [OOB] Management Network (Cloud)
 ip address dhcp
 no shutdown
!
! ------------------------------------------------------------------------------
! LINE CONFIGURATION (CONSOLE & VTY SSH)
! ------------------------------------------------------------------------------
line con 0
 exec-timeout 0 0
 logging synchronous
line vty 0 4
 transport input ssh
 exec-timeout 30 0
 logging synchronous
!
end

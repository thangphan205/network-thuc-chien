server {
    listen 443 ssl;
    server_name app.chain.local;

    ssl_certificate     /etc/nginx/ssl/chuoi_crosssign.crt;
    ssl_certificate_key /etc/nginx/ssl/serverX.key;

    location / {
        return 200 "TAP 08 / MR6 - CHUOI CROSS-SIGN (leaf + R3 + cross)\n";
        add_header Content-Type text/plain;
    }
}

server {
    listen 443 ssl;
    server_name app.chain.local;

    ssl_certificate     /etc/nginx/ssl/chuoi_thuaroot.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    location / {
        return 200 "TAP 08 / MR2 - CHUOI THUA ROOT (leaf + int + root)\n";
        add_header Content-Type text/plain;
    }
}

server {
    listen 443 ssl;
    server_name app.chain.local;

    ssl_certificate     /etc/nginx/ssl/chuoi_daonguoc.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    location / {
        return 200 "TAP 08 / MR1 - CHUOI DAO NGUOC (intermediate dung truoc)\n";
        add_header Content-Type text/plain;
    }
}

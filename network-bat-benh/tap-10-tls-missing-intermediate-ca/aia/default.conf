# ==============================================================================
# MAY CHU AIA — noi client TU TAI cert cua nguoi ky ve (MR4).
#
# Leaf cua MR4 mang dong:
#     Authority Information Access: CA Issuers - URI:http://aia.lab.local/intermediateCA.der
# Trinh duyet doc dong do, tai file ve, va TU VA lai chuoi bi thieu. Curl / Java
# / Python / mobile app KHONG lam buoc nay. Do la ly do "may tinh vao duoc ma
# dien thoai thi khong" — ca hai deu nhan dung mot chuoi thieu nhu nhau.
#
# ⚠️ Phai tra ve DER (application/pkix-cert), khong phai PEM. RFC 5280 quy dinh
#    vay, va trinh duyet tu choi PEM o day.
# ==============================================================================
server {
    listen 80;
    server_name aia.lab.local;
    root /certs;

    location = /intermediateCA.der {
        default_type application/pkix-cert;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        return 200 "May chu AIA cua lab 10. Thu: /intermediateCA.der\n";
        add_header Content-Type text/plain;
    }
}

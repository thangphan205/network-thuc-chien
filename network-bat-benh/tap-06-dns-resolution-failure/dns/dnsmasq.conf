# ==============================================================================
# DNS server cua lab tap 06 (dnsmasq)
#
# File nay la CAU HINH CHUAN. Cac script kich ban se ghi de file dang chay
# (/etc/dnsmasq/dnsmasq.conf) roi khoi dong lai dnsmasq; `0-setup.sh` chep ban
# .default nay tro lai de ve trang thai khoe.
# ==============================================================================

# Khong doc /etc/resolv.conf cua container. Neu doc, dnsmasq se lay 127.0.0.11
# (DNS nhung cua Docker) lam forwarder -> ket qua phu thuoc moi truong ben ngoai
# va lab khong con tat dinh.
no-resolv

# Khong doc /etc/hosts cua chinh container dns. Toan bo ban ghi cua lab nam o
# mot file duy nhat, de script sua truc tiep.
no-hosts
addn-hosts=/etc/dnsmasq/zone-hosts

# Nhan lam server co tham quyen cho lab.local:
#   - Ten CO trong zone-hosts  -> tra IP.
#   - Ten KHONG co trong zone  -> tra NXDOMAIN ngay, KHONG forward di dau.
# Day la thu tao ra chu ky NXDOMAIN cua KB4.
local=/lab.local/

# TTL ngan de doi ban ghi trong lop hoc khong phai cho lau.
local-ttl=30

# In moi truy van ra FILE trong container -> `./scripts/xem-log-dns.sh` thanh GOC NHIN PHIA
# SERVER, doi chieu voi `dig` phia client. Day la bang chung phan tach
# "resolver cam" (log trong) voi "resolver tra loi sai" (log co dong query).
log-queries
log-facility=/var/log/dnsmasq.log

# Chi phuc vu trong lab.
interface=eth0
bind-interfaces
port=53
cache-size=1000

# Vi sao ghi log ra FILE chu khong ra stdout? dnsmasq duoc khoi dong bang
# `docker exec` (xem dns-start) nen no KHONG phai PID 1 cua container —
# `docker compose logs dns` se khong bat duoc dong nao. Ghi ra file la cach duy
# nhat giu duoc goc nhin phia server. Xem bang ./scripts/xem-log-dns.sh

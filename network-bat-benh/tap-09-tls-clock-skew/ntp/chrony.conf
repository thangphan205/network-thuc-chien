# ==============================================================================
# chronyd lam NTP SERVER cho lab — khong hoi ai, chi tra loi.
# ==============================================================================

# Tu nhan minh la nguon dong bo hop le o stratum 8, ke ca khi khong co upstream.
# Thieu dong nay, chronyd se tra loi client bang stratum 16 = "chua dong bo",
# va client se tu choi ket qua -> MR5 khong con phan biet duoc "bi chan" voi
# "hoi duoc nhung nguon khong dung duoc".
local stratum 8

# Cho ca subnet cua lab hoi gio.
allow 172.28.9.0/24

# Khong dong bo dong ho cua chinh container nay: no dung chung dong ho kernel
# voi may that cua hoc vien. Container KHONG duoc cap CAP_SYS_TIME nen thao tac
# do se that bai — nhung noi ro y dinh o day van hon de no that bai am tham.
# (khong khai bao `pool`/`server` nao ca = khong co upstream de dong bo)

# Ghi log de soi khi can.
logdir /var/log/chrony

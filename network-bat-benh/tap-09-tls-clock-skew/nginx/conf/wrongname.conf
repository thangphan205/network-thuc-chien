# ------------------------------------------------------------------------------
# MR2 — cert con han, CA tin duoc, nhung SAN=other.local (SAI TEN MIEN).
# Sinh boi scripts/ — dung sua tay. dat_cert() cua lib.sh copy file nay
# de len nginx/nginx.conf (da gitignore) roi restart web-server.
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    server_name secure.local;

    ssl_certificate     /etc/nginx/ssl/wrongname.crt;
    ssl_certificate_key /etc/nginx/ssl/wrongname.key;

    # --------------------------------------------------------------------------
    # ⚠️ HAI DONG NAY LA DIEU KIEN SONG CON CUA MR4, dung xoa.
    #
    # MR4 mo mot phien TLS roi GIU IM hon mot phut de cho cert het han, sau do
    # moi gui request tren chinh phien do. Nhung nginx mac dinh:
    #     client_header_timeout 60s  -> dong ket noi neu 60s khong thay header
    #     keepalive_timeout     75s
    # Nen phien bi NGINX dong truoc khi cert kip het han. Khi do MR4 khong con
    # chung minh duoc dieu no muon chung minh, va hong theo kieu kho lan nhat:
    # tien trinh ghi vao mot socket da dong -> SIGPIPE -> script chet AM THAM,
    # khong mot dong loi nao.
    # --------------------------------------------------------------------------
    client_header_timeout 300s;
    keepalive_timeout     300s;

    location / {
        add_header Content-Type "text/plain; charset=utf-8";
        return 200 "CA BỆNH 09: KẾT NỐI HTTPS THÀNH CÔNG (TLS OK)!\n";
    }
}

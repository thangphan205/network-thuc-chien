services:
  certgen:
    build: ./certgen
    container_name: lab07-certgen
    volumes:
      - ./nginx/ssl:/certs

  # Seed nginx.conf = trạng thái ĐÃ CHỮA (cert hợp lệ) lúc `up`.
  # nginx.conf được gitignore nên chạy fault/cure không làm bẩn cây git.
  config-init:
    image: alpine:latest
    container_name: lab07-config-init
    volumes:
      - ./nginx:/nginx
    command: sh -c "cp /nginx/conf/good.conf /nginx/nginx.conf"

  web-server:
    image: nginx:alpine
    container_name: lab07-web-server
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "8443:443"
    depends_on:
      certgen:
        condition: service_completed_successfully
      config-init:
        condition: service_completed_successfully
    networks:
      lab-net:
        ipv4_address: 172.28.7.10

  client:
    build: ./client
    container_name: lab07-client
    init: true
    volumes:
      - ./nginx/ssl:/etc/ssl/lab:ro
    networks:
      lab-net:
        ipv4_address: 172.28.7.20
    depends_on:
      - web-server

networks:
  lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.7.0/24

services:
  web-server:
    image: nginx:alpine
    container_name: lab07-web-server
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "8443:443"
    networks:
      lab-net:
        ipv4_address: 172.28.7.10

  client:
    image: alpine:latest
    container_name: lab07-client
    cap_add:
      - SYS_TIME
    command: sleep infinity
    init: true
    volumes:
      - ./nginx/ssl/ca.crt:/etc/ssl/certs/ca-custom.crt:ro
    networks:
      lab-net:
        ipv4_address: 172.28.7.20
    depends_on:
      - web-server

networks:
  lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.7.0/24

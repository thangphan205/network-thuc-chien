server {
    listen 443 ssl;
    server_name secure.local;

    ssl_certificate /etc/nginx/ssl/expired.crt;
    ssl_certificate_key /etc/nginx/ssl/expired.key;

    location / {
        return 200 "CA BENH 07: KET NOI HTTPS THANH CONG (TLS OK)!\n";
        add_header Content-Type text/plain;
    }
}

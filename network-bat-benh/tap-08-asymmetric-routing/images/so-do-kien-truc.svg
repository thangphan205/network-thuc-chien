          <rect x="794" y="101" width="90" height="18" rx="2" fill="#f5f5f5" /><text x="839" y="114" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">src .251</text>
          <rect x="404" y="143" width="82" height="18" rx="2" fill="#f5f5f5" /><text x="445" y="156" fill="#2e5aa8" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">dst .20</text>
          <rect x="790" y="143" width="90" height="18" rx="2" fill="#f5f5f5" /><text x="835" y="156" fill="#2e5aa8" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">dst .251</text>

          <text x="640" y="158" fill="#2e5aa8" font-size="15" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="middle">MASQUERADE .20 → .251</text>
          <text x="640" y="180" fill="#4f5d75" font-size="13" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">ESTABLISHED · thấy đủ 2 chiều</text>
          <text x="640" y="358" fill="#4f5d75" font-size="15" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="middle">0 session · 0 INVALID</text>
          <text x="640" y="380" fill="#7a8399" font-size="13" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">route .252 còn, không dùng tới</text>

          <text x="1110" y="260" fill="#7a8399" font-size="13" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">về → fw-b .252 (giữ nguyên)</text>
          <text x="268" y="348" fill="#2d3142" font-size="16" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="end">THÔNG</text>
          <text x="268" y="378" fill="#2d3142" font-size="16" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="end">200</text>
          <text x="1012" y="350" fill="#eb6c36" font-size="16" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="start">172.28.18.251</text>
          <text x="1012" y="376" fill="#7a8399" font-size="13" font-weight="500" font-family="'Geist', sans-serif" text-anchor="start">fw-a — mất IP thật client</text>
        </g>


        <text x="514" y="96" fill="#4f5d75" font-size="15" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="start">.251</text>
        <text x="766" y="96" fill="#4f5d75" font-size="15" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">.251</text>
        <text x="640" y="118" fill="#4f5d75" font-size="13" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">stateful · conntrack riêng</text>
        <line x1="514" y1="132" x2="766" y2="132" stroke="rgba(45,49,66,0.12)" stroke-width="1" />


        <circle cx="652" cy="445" r="9" fill="#f5f5f5" stroke="#eb6c36" stroke-width="2" /><line x1="646.8" y1="439.8" x2="657.2" y2="450.2" stroke="#eb6c36" stroke-width="2.4" stroke-linecap="round" /><line x1="657.2" y1="439.8" x2="646.8" y2="450.2" stroke="#eb6c36" stroke-width="2.4" stroke-linecap="round" />

        <rect x="20" y="40" width="540" height="372" rx="8" fill="rgba(79,93,117,0.06)" stroke="rgba(79,93,117,0.35)" stroke-width="1.2" />
        <text x="36" y="62" fill="rgba(45,49,66,0.55)" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">LAN CLIENT · 172.28.8.0/24</text>
        <rect x="720" y="40" width="540" height="372" rx="8" fill="rgba(79,93,117,0.06)" stroke="rgba(79,93,117,0.35)" stroke-width="1.2" />
        <text x="1244" y="62" fill="rgba(45,49,66,0.55)" font-size="11" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">LAN SERVER · 172.28.18.0/24</text>

        <!-- ============ CABLES (LAN segments) ============ -->
        <g fill="none" stroke="rgba(45,49,66,0.20)" stroke-width="2.4" stroke-linejoin="round">
          <path d="M280 214 H390 V130 H500" />
          <path d="M280 242 H390 V330 H500" />
          <path d="M780 130 H890 V214 H1000" />
          <path d="M780 330 H890 V242 H1000" />
        </g>

        <!-- ============ NODES ============ -->
        <!-- client -->
        <rect x="60" y="176" width="220" height="104" rx="8" fill="#f5f5f5" /><rect x="60" y="176" width="220" height="104" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.6" />
        <text x="170" y="210" fill="#2d3142" font-size="22" font-weight="700" font-family="'Geist', sans-serif" text-anchor="middle">client</text>
        <text x="170" y="234" fill="#4f5d75" font-size="13" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">.20 · Alpine · curl</text>
        <text x="170" y="260" fill="#7a8399" font-size="13" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">đi ra → fw-a .251</text>

        <!-- server -->
        <rect x="1000" y="176" width="220" height="104" rx="8" fill="#f5f5f5" /><rect x="1000" y="176" width="220" height="104" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.6" />
        <text x="1110" y="210" fill="#2d3142" font-size="22" font-weight="700" font-family="'Geist', sans-serif" text-anchor="middle">server</text>
        <text x="1110" y="234" fill="#4f5d75" font-size="13" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">.10 · nginx :80</text>

        <!-- fw-a -->
        <rect x="500" y="64" width="280" height="132" rx="8" fill="#f5f5f5" /><rect x="500" y="64" width="280" height="132" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1.6" />

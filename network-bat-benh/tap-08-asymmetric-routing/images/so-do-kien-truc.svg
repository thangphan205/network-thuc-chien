        <text x="72" y="378" fill="#7a8399" font-size="14" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="start">curl</text>

        <rect x="1000" y="300" width="220" height="92" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1.2" />

        <text x="640" y="296" fill="#2d3142" font-size="22" font-weight="700" font-family="'Geist', sans-serif" text-anchor="middle">fw-b</text>
        <text x="514" y="296" fill="#4f5d75" font-size="15" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="start">.252</text>
        <text x="766" y="296" fill="#4f5d75" font-size="15" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">.252</text>
        <text x="640" y="318" fill="#4f5d75" font-size="13" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">stateful · conntrack riêng</text>
        <line x1="514" y1="332" x2="766" y2="332" stroke="rgba(45,49,66,0.12)" stroke-width="1" />

        <!-- no state sync between fw-a and fw-b -->
        <line x1="640" y1="196" x2="640" y2="264" stroke="#7a8399" stroke-width="1.4" stroke-dasharray="5 4" />

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="10 30 1260 434" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" role="img"
        aria-labelledby="lab08-topo-title lab08-topo-desc">
        <title id="lab08-topo-title">Kiến trúc lab Asymmetric Routing</title>
        <desc id="lab08-topo-desc">Hai LAN: client Alpine 172.28.8.20 ở LAN 172.28.8.0/24, server nginx 172.28.18.10 ở LAN
          172.28.18.0/24. Hai router stateful fw-a (.251 ở cả hai LAN) và fw-b (.252) nằm song song giữa hai LAN, mỗi cái
          giữ bảng conntrack riêng, không đồng bộ. Client luôn đi ra qua fw-a. Ba tab: khỏe (server về qua fw-a, curl 200),
          bất đối xứng (server về qua fw-b, fw-b chưa thấy SYN nên DROP SYN-ACK là gói INVALID, curl 000 dù ping thông),
          chữa bằng SNAT tại fw-a (server trả lời về 172.28.18.251 cùng LAN, đường về tự đối xứng, curl 200 nhưng nginx mất
          IP thật của client).
        </desc>

        <defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600;700&amp;display=swap');.kb2{display:none}.kb3{display:none}.kb1{display:inline}</style>
          <marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
            <polygon points="0 0, 9 3.5, 0 7" fill="#4f5d75" />
          </marker>
          <marker id="arrow-accent" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
            <polygon points="0 0, 9 3.5, 0 7" fill="#eb6c36" />
          </marker>
          <marker id="arrow-link" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
            <polygon points="0 0, 9 3.5, 0 7" fill="#2e5aa8" />
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5" />


          <rect x="420" y="101" width="42" height="18" rx="2" fill="#f5f5f5" /><text x="441" y="114" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">SYN</text>
          <rect x="818" y="101" width="42" height="18" rx="2" fill="#f5f5f5" /><text x="839" y="114" fill="#4f5d75" font-size="12" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">SYN</text>

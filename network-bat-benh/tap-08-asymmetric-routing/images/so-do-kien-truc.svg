          <text x="640" y="158" fill="#eb6c36" font-size="15" font-weight="700" font-family="'Geist Mono', monospace" text-anchor="middle">SYN_SENT [UNREPLIED]</text>
          <text x="640" y="180" fill="#4f5d75" font-size="13" font-weight="500" font-family="'Geist Mono', monospace" text-anchor="middle">thấy SYN, chờ SYN-ACK mãi</text>
          <rect x="500" y="264" width="280" height="132" rx="8" fill="none" stroke="#eb6c36" stroke-width="1.8" />

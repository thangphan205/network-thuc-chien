          <text x="1012" y="376" fill="#7a8399" font-size="13" font-weight="500" font-family="'Geist', sans-serif" text-anchor="start">bắt tay chưa bao giờ xong</text>
        </g>

        <!-- ============ KB3 — SNAT at fw-a ============ -->
